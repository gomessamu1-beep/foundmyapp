name: Build FoundMyApp APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
    paths:
      - "index.html"
      - "index"
      - ".github/workflows/build-foundmyapp-apk-from-site.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do site
        uses: actions/checkout@v4

      - name: Baixar projeto Android
        uses: actions/checkout@v4
        with:
          ref: apk-android
          path: android-source

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de teste
        working-directory: android-source/android-app
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: FoundMyApp-APK
          path: android-source/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

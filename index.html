    function splitInstallments(total, n) {
      const totalCents = Math.round(total * 100); const base = Math.floor(totalCents / n); let remainder = totalCents - base * n; const result = [];
      for (let i = 0; i < n; i++) { let val = base; if (remainder > 0) { val += 1; remainder -= 1; } result.push(val / 100); } return result;

    }

    function normalizeBankCode(code) { const digits=String(code||'').replace(/\D/g,''); if(!digits)return ''; return digits.length>=4?digits.slice(-3).padStart(3,'0'):digits.padStart(3,'0'); }
    function normalizeAccountNumber(value) { return String(value||'').replace(/\D/g,''); }
    function parseOFX(ofxString, arquivoId = '', arquivoNome = '') {
      const transactions = [];
      const statementsMeta = [];
      let ordemImportacao = 0;
      const statementRegex = /<STMTRS>([\s\S]*?)(?:<\/STMTRS>|(?=<STMTRS>))/gi;
      const statements = [];
      let sm;
      while ((sm = statementRegex.exec(ofxString)) !== null) statements.push(sm[1]);
      if (!statements.length) statements.push(ofxString);

      statements.forEach((statement, statementIndex) => {
        const getTag = (text, tag) => {
          const m = text.match(new RegExp(`<${tag}>\\s*([^<\\r\\n]+)`, 'i'));
          return m ? m[1].trim() : '';
        };

        // Informações da conta bancária que constam no próprio OFX.
        const rawBankId = getTag(statement, 'BANKID');
        const bankCode = normalizeBankCode(rawBankId);
        const branchId = getTag(statement, 'BRANCHID');
        const acctId = getTag(statement, 'ACCTID');
        const meta = {
          arquivoId,
          arquivoNome,
          statementIndex,
          bancoOfx: rawBankId || '',
          bancoCodeOfx: bankCode || '',
          agenciaOfx: branchId || '',
          contaOfx: acctId || ''
        };
        statementsMeta.push(meta);

        const rx = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
        let match;
        while ((match = rx.exec(statement)) !== null) {
          const block = match[1];
          const type = getTag(block, 'TRNTYPE').toUpperCase();
          const dt = getTag(block, 'DTPOSTED').substring(0, 8);
          const amt = Number.parseFloat(getTag(block, 'TRNAMT'));
          const fitid = getTag(block, 'FITID');
          const memo = getTag(block, 'MEMO');
          const name = getTag(block, 'NAME');
          if (!Number.isFinite(amt)) continue;
          transactions.push({
            id: `ofx-${Date.now()}-${ordemImportacao}-${uid()}`,
            fitid: fitid || '',
            data: dt ? `${dt.substring(0,4)}-${dt.substring(4,6)}-${dt.substring(6,8)}` : '',
            valor: amt,
            descricao: name || memo || 'Transação OFX',
            tipo: type,
            conciliado: false,
            conciliacaoId: null,
            lancamentoId: null,
            contaOfx: acctId,
            bancoOfx: rawBankId,
            bancoCode,
            agenciaOfx: branchId,
            ofxArquivoId: arquivoId,
            ofxArquivoNome: arquivoNome,
            ofxImportadoEm: new Date().toISOString(),
            ordemImportacao: ordemImportacao++
          });
        }
      });
      return { transactions, statementsMeta };
    }

            transferenciaId: transId, isLancamentoDireto: true, bancoBaixaId: lrContaDestino, dataBaixa: lrData,
            conciliado: false, conciliacaoId: null
          };
          updateContasPagar(prev => [...prev, debitoEntry]);
          updateContasReceber(prev => [...prev, creditoEntry]);
        } else {
          const entryId = uid();
          const entry = {
            id: entryId, descricao: lrDescricao.trim(), observacao: lrObservacao.trim(), total, dataCompra: lrData, parcelas: 1, parcelaInicial: 1,
            inicio: faturaMes, recorrente: false, cartaoId: null, categoriaId: lrCategoriaId,
            subcategoriaId: lrSubcategoriaId, status: "Baixado", criadoEm: Date.now(),
            transferenciaId: null, isLancamentoDireto: true, bancoBaixaId: lrContaOrigem, dataBaixa: lrData,
            conciliado: conciliadoAutomaticamente, conciliacaoId: conciliacaoId
          };
          if (lrTipo === 'despesa') updateContasPagar(prev => [...prev, entry]);
          else updateContasReceber(prev => [...prev, entry]);

          if (veioDoOfx) {
            updateOfxData(prev => prev.map(o =>
              o.id === ofxOrigem.id && mesmaContaOfx(o.contaId, concilContaId)
                ? { ...o, conciliado: true, conciliacaoId: conciliacaoId, lancamentoId: entryId }
                : o
            ));
          }
        }

        if (veioDoOfx) {
          setOfxSelectedIds([]);
          setSysSelectedIds([]);
        }
        setLrModalOpen(false);
      }

      function handleLrCategoriaChange(catId) {
        setLrCategoriaId(catId);
        setLrSubcategoriaId('');
        const cat = getCategoria(catId);
        if (cat && cat.isTransferencia) {
          setLrIsTransferencia(true);
        } else {
          setLrIsTransferencia(false);
          setLrContaDestino('');
        }
      }

      function executarBaixaIndividual(type, id, bancoId, dataBaixaStr) {
        if (!bancoId) return alert("Selecione banco."); if (!dataBaixaStr) return alert("Informe data."); if (isDiaFechado(dataBaixaStr) || isMesFechado(dataBaixaStr.substring(0, 7))) return alert("Dia ou mês bloqueado.");
        if (type === "pagar") updateContasPagar(prev => prev.map(p => p.id === id ? { ...p, status: "Baixado", bancoBaixaId: bancoId, dataBaixa: dataBaixaStr } : p)); else if (type === "receber") updateContasReceber(prev => prev.map(p => p.id === id ? { ...p, status: "Baixado", bancoBaixaId: bancoId, dataBaixa: dataBaixaStr } : p));
        setBaixaModal({ open: false, type: null, id: null, bancoId: "", dataBaixa: currentDate() });
      }

      function executarBaixaLote(type, bancoId, ids, dataBaixaStr) {
        if (!bancoId || !ids || ids.length === 0 || !dataBaixaStr) return alert("Preencha todos os campos."); if (isDiaFechado(dataBaixaStr) || isMesFechado(dataBaixaStr.substring(0, 7))) return alert("Dia ou mês bloqueado.");
        if (type === "pagar") { updateContasPagar(prev => prev.map(p => ids.includes(p.id) ? { ...p, status: "Baixado", bancoBaixaId: bancoId, dataBaixa: dataBaixaStr } : p)); setBatchPagarIds([]); } else if (type === "receber") { updateContasReceber(prev => prev.map(p => ids.includes(p.id) ? { ...p, status: "Baixado", bancoBaixaId: bancoId, dataBaixa: dataBaixaStr } : p)); setBatchReceberIds([]); }
        setBatchBaixaModal({ open: false, bancoId: "", dataBaixa: currentDate() });
      }

      function executarEstornoBaixa(type, id, dataBaixa) {
        if (dataBaixa && (isDiaFechado(dataBaixa) || isMesFechado(dataBaixa.substring(0, 7)))) return alert("Dia ou mês bloqueado."); 
        if (!window.confirm("Deseja estornar baixa?")) return;
        
        let transId = null;
        if (type === "pagar") { const item = contasPagar.find(p => p.id === id); if(item?.conciliado)return alert('Não é permitido estornar a baixa de um lançamento conciliado. Desfaça a conciliação primeiro.'); transId = item?.transferenciaId; }
        else if (type === "receber") { const item = contasReceber.find(p => p.id === id); if(item?.conciliado)return alert('Não é permitido estornar a baixa de um lançamento conciliado. Desfaça a conciliação primeiro.'); transId = item?.transferenciaId; }

        const estornoUpdater = prev => prev.map(p => (p.id === id || (transId && p.transferenciaId === transId)) ? { ...p, status: "Em aberto", bancoBaixaId: null, dataBaixa: null, conciliado: false } : p);

        if (type === "pagar") { 
          updateContasPagar(estornoUpdater); 
          if (transId) updateContasReceber(estornoUpdater); 
        } 
        else if (type === "receber") { 
          updateContasReceber(estornoUpdater); 
          if (transId) updateContasPagar(estornoUpdater); 
        }
      }

      function executarEstornoLote(type, ids) {
        if (!ids || ids.length === 0) return alert("Nenhum item selecionado."); const listaAlvo = type === "pagar" ? contasPagar : contasReceber;
        for (const id of ids) { const item = listaAlvo.find(i => i.id === id); if (item && item.dataBaixa) { if (isDiaFechado(item.dataBaixa) || isMesFechado(item.dataBaixa.substring(0, 7))) return alert(`Estorno cancelado: Há itens cuja data de baixa (${formatDateBR(item.dataBaixa)}) ou mês está bloqueada.`); } }
        if (!window.confirm(`Deseja estornar a baixa dos ${ids.length} itens?`)) return;
        if (type === "pagar") { updateContasPagar(prev => prev.map(p => ids.includes(p.id) ? { ...p, status: "Em aberto", bancoBaixaId: null, dataBaixa: null, conciliado: false } : p)); setBatchPagarIds([]); } else if (type === "receber") { updateContasReceber(prev => prev.map(p => ids.includes(p.id) ? { ...p, status: "Em aberto", bancoBaixaId: null, dataBaixa: null, conciliado: false } : p)); setBatchReceberIds([]); }
      }

      // Calcula o valor da fatura do cartão em uma competência, reutilizado no saldo corrido.
      function calcularTotalFaturaCompetencia(comp) {
        const values = purchases.map(p => {
          const idx = monthDiff(p.inicio, comp); if (idx < 0) return 0;
          if (p.canceladoEm && comp >= p.canceladoEm) return 0;
          const mesesExcluidos = p.mesesExcluidos || []; if (mesesExcluidos.includes(comp)) return 0;
          if (p.recorrente) return p.total;
          const pInicial = p.parcelaInicial || 1; const qtdRestante = p.parcelas - pInicial + 1; if (idx >= qtdRestante) return 0;
          const split = splitInstallments(p.total, p.parcelas); return split[(pInicial - 1) + idx] || 0;
        });
        return values.reduce((sum, value) => sum + value, 0);
      }

      // Reconciliation OFX logic
      const movimentacoesConciliacao = useMemo(() => {
        if (!concilExibido || !concilContaId) return [];
        const lista = [];
        contasPagar.forEach(p => {
          if (p.status === "Baixado" && String(p.bancoBaixaId) === String(concilContaId) && p.dataBaixa) {
            if (p.dataBaixa >= concilDataIniAplicada && p.dataBaixa <= concilDataFimAplicada) {
              lista.push({ id: p.id, tipoOrigem: 'pagar', itemRef: p, data: p.dataBaixa, descricao: p.descricao, observacao: p.observacao, tipo: "Débito", valorDebito: p.recorrente ? p.valorParcela : (p.valorParcela || p.total), valorCredito: 0, conciliado: !!p.conciliado });
            }
          }
        });
        contasReceber.forEach(r => {
          if (r.status === "Baixado" && String(r.bancoBaixaId) === String(concilContaId) && r.dataBaixa) {
            if (r.dataBaixa >= concilDataIniAplicada && r.dataBaixa <= concilDataFimAplicada) {
              lista.push({ id: r.id, tipoOrigem: 'receber', itemRef: r, data: r.dataBaixa, descricao: r.descricao, observacao: r.observacao, tipo: "Crédito", valorDebito: 0, valorCredito: r.recorrente ? r.valorParcela : (r.valorParcela || r.total), conciliado: !!r.conciliado });
            }
          }
        });
        Object.entries(faturasBaixadas).forEach(([comp, baixa]) => {
          if (baixa && baixa.status === 'Baixado' && String(baixa.bancoId) === String(concilContaId) && baixa.dataBaixa) {
            if (baixa.dataBaixa >= concilDataIniAplicada && baixa.dataBaixa <= concilDataFimAplicada) {
              const totalComp = calcularTotalFaturaCompetencia(comp);
              if (totalComp > 0) lista.push({ id: `fat-${comp}`, tipoOrigem: 'fatura', competenciaRef: comp, baixaRef: baixa, data: baixa.dataBaixa, descricao: `Pagamento Fatura Cartão: ${formatMonthLabel(comp)}`, observacao: '', tipo: "Débito", valorDebito: totalComp, valorCredito: 0, conciliado: !!baixa.conciliado });
            }
          }
        });

        // Saldo anterior: tudo que já entrou/saiu da conta antes do início do período consultado.
        let saldoAnterior = 0;
        contasPagar.forEach(p => {
          if (p.status === "Baixado" && String(p.bancoBaixaId) === String(concilContaId) && p.dataBaixa && p.dataBaixa < concilDataIniAplicada) {
            saldoAnterior -= Number(p.recorrente ? p.valorParcela : (p.valorParcela || p.total)) || 0;
          }
        });
        contasReceber.forEach(r => {
          if (r.status === "Baixado" && String(r.bancoBaixaId) === String(concilContaId) && r.dataBaixa && r.dataBaixa < concilDataIniAplicada) {
            saldoAnterior += Number(r.recorrente ? r.valorParcela : (r.valorParcela || r.total)) || 0;
          }
        });
        Object.entries(faturasBaixadas).forEach(([comp, baixa]) => {
          if (baixa && baixa.status === 'Baixado' && String(baixa.bancoId) === String(concilContaId) && baixa.dataBaixa && baixa.dataBaixa < concilDataIniAplicada) {
            saldoAnterior -= Number(calcularTotalFaturaCompetencia(comp)) || 0;
          }
        });

        lista.sort((a, b) => a.data.localeCompare(b.data));
        let saldoAcumulado = saldoAnterior + Number(contasBancarias.find(c => String(c.id) === String(concilContaId))?.saldoInicial || 0);
        return lista.map(item => {
          saldoAcumulado += (item.valorCredito - item.valorDebito);
          return { ...item, saldo: saldoAcumulado };
        });
      }, [concilExibido, concilContaId, concilDataIniAplicada, concilDataFimAplicada, contasPagar, contasReceber, faturasBaixadas, purchases]);

      const resumoDiarioConcil = useMemo(() => {
        const grupos = {}; movimentacoesConciliacao.forEach(m => { if (!grupos[m.data]) grupos[m.data] = { data: m.data, debitos: 0, creditos: 0, itens: [] }; grupos[m.data].debitos += m.valorDebito; grupos[m.data].creditos += m.valorCredito; grupos[m.data].itens.push(m); });
        return Object.values(grupos).sort((a, b) => a.data.localeCompare(b.data));
      }, [movimentacoesConciliacao]);

      const totalDebitosConcil = movimentacoesConciliacao.reduce((s, m) => s + m.valorDebito, 0);
      const totalCreditosConcil = movimentacoesConciliacao.reduce((s, m) => s + m.valorCredito, 0);
      const saldoFinalConcil = movimentacoesConciliacao.length ? movimentacoesConciliacao[movimentacoesConciliacao.length - 1].saldo : 0;
      const normalizarDataOfx = (valor) => {
        const s = String(valor || '').trim();
        if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
        const m = s.match(/^(\d{2})[\/.-](\d{2})[\/.-](\d{4})$/);
        return m ? `${m[3]}-${m[2]}-${m[1]}` : s.substring(0, 10);
      };
      const ofxFiltrado = useMemo(() => {
        const ini = normalizarDataOfx(concilDataIniAplicada);
        const fim = normalizarDataOfx(concilDataFimAplicada);
        const contaIdSelecionada = String(concilContaId || '');

        if (!contaIdSelecionada) return [];

        const contaSelecionada = contasBancarias.find(c => String(c.id) === contaIdSelecionada);
        const nomeContaSelecionada = String(contaSelecionada?.nome || '').trim();

        return ofxData.filter(o => {
          /*
           * REGRA DA CONCILIAÇÃO:
           * O OFX é validado contra Banco/Agência/Conta SOMENTE no momento
           * da importação. Depois de importado, a tela usa o vínculo salvo
           * no lançamento (contaId). Não fazemos nova validação bancária aqui.
           *
           * Para dados antigos, aceitamos também contaNome. Isso evita que
           * um OFX legítimo desapareça apenas porque foi gravado por uma
           * versão anterior do sistema sem contaId.
           */
          const idOk = String(o?.contaId || '') === contaIdSelecionada;
          const nomeOk = !!(nomeContaSelecionada && String(o?.contaNome || '').trim() === nomeContaSelecionada);
          let pertence = idOk || nomeOk;

          // Último fallback exclusivamente para registros legados sem contaId
          // e sem contaNome: usa os dados bancários que já estavam no registro.
          if (!pertence && !o?.contaId && !o?.contaNome && contaSelecionada) {
            const bancoSistema = normalizeBankCode(contaSelecionada.bancoCode || contaSelecionada.banco);
            const bancoOfx = normalizeBankCode(o?.bancoCode || o?.bancoCodeOfx || o?.bancoOfx);
            const agenciaSistema = normalizeAccountNumber(contaSelecionada.agencia || contaSelecionada.agenciaBancaria);
            const agenciaOfx = normalizeAccountNumber(o?.agenciaOfx || o?.agencia || o?.branchId);
            const contaSistema = normalizeAccountNumber(contaSelecionada.numero || contaSelecionada.conta);
            const contaOfx = normalizeAccountNumber(o?.contaOfx || o?.acctId || o?.conta);

            pertence =
              !!(bancoOfx || agenciaOfx || contaOfx) &&
              (!bancoOfx || !bancoSistema || bancoOfx === bancoSistema) &&
              (!agenciaOfx || !agenciaSistema || agenciaOfx === agenciaSistema) &&
              (!contaOfx || !contaSistema ||
                contaOfx === contaSistema ||
                contaOfx.endsWith(contaSistema) ||
                contaSistema.endsWith(contaOfx));
          }

          if (!pertence) return false;

          // Se o usuário ainda não clicou em Filtrar Período, mostramos todos
          // os OFX da conta. Depois do clique, aplicamos exclusivamente o período.
          if (!concilDataIniAplicada && !concilDataFimAplicada) return true;

          const dataOfx = normalizarDataOfx(o?.data);
          if (!/^\d{4}-\d{2}-\d{2}$/.test(dataOfx)) return true;

          return (!ini || dataOfx >= ini) && (!fim || dataOfx <= fim);
        }).slice().sort((a, b) => {
          const da = normalizarDataOfx(a?.data);
          const db = normalizarDataOfx(b?.data);
          return da.localeCompare(db) || (a?.ordemImportacao || 0) - (b?.ordemImportacao || 0);
        });
      }, [ofxData, concilContaId, concilDataIniAplicada, concilDataFimAplicada, contasBancarias]);
      const ofxSelecionadoUnico=ofxSelectedIds.length===1?ofxData.find(o=>o.id===ofxSelectedIds[0]&&ofxPertenceContaSelecionada(o,concilContaId)):null;

      function handleOfxUpload(e){
        if(!concilContaId){ alert('Selecione a Conta Bancária no filtro antes de importar o arquivo OFX.'); return; }
        const conta = contasBancarias.find(c => String(c.id) === String(concilContaId));
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = evt => {
          const arquivoId = `ofx-arq-${Date.now()}-${uid()}`;
          const parsed = parseOFX(evt.target.result, arquivoId, file.name);
          if(!parsed.transactions.length) return alert('O arquivo OFX não possui lançamentos válidos.');

          const bancoSistema = normalizeBankCode(conta?.bancoCode);
          const agenciaSistema = normalizeAccountNumber(conta?.agencia);
          const contaSistema = normalizeAccountNumber(conta?.numero);

          const inconsistencias = [];
          const metadadosValidacao = parsed.statementsMeta.map((m, i) => {
            const bancoOfx = normalizeBankCode(m.bancoCodeOfx || m.bancoOfx);
            const agenciaOfx = normalizeAccountNumber(m.agenciaOfx);
            const contaOfx = normalizeAccountNumber(m.contaOfx);
            const bancoOk = !bancoOfx || !bancoSistema || bancoOfx === bancoSistema;
            const agenciaOk = !agenciaOfx || !agenciaSistema || agenciaOfx === agenciaSistema;
            const contaOk = !contaOfx || !contaSistema || contaOfx === contaSistema || contaOfx.endsWith(contaSistema) || contaSistema.endsWith(contaOfx);
            if(!bancoOk) inconsistencias.push(`Banco: OFX ${bancoOfx} x sistema ${bancoSistema}`);
            if(!agenciaOk) inconsistencias.push(`Agência: OFX ${agenciaOfx} x sistema ${agenciaSistema}`);
            if(!contaOk) inconsistencias.push(`Conta: OFX ${contaOfx} x sistema ${contaSistema}`);
            return { ...m, bancoOk, agenciaOk, contaOk };
          });

          const algumDadoBancario = parsed.statementsMeta.some(m => m.bancoCodeOfx || m.agenciaOfx || m.contaOfx);
          if(!algumDadoBancario){
            return alert('Importação bloqueada: o arquivo OFX não trouxe número do banco, agência ou conta suficientes para validar a conta selecionada.');
          }
          if(inconsistencias.length){
            return alert(`Importação bloqueada. O arquivo OFX não corresponde à conta selecionada.\n\n${[...new Set(inconsistencias)].join('\n')}`);
          }

          const transacoes = parsed.transactions.map(t => ({
            ...t,
            contaId: String(concilContaId),
            contaNome: conta.nome,
            bancoCode: t.bancoCode || bancoSistema,
            agenciaOfx: t.agenciaOfx || conta.agencia || '',
            bancoOfx: t.bancoOfx || conta.bancoCode || '',
            ofxArquivoId: arquivoId,
            ofxArquivoNome: file.name,
            ofxContaValidada: true,
            ofxContaValidadaEm: new Date().toISOString()
          }));

          const datas = [...new Set(transacoes.map(t => t.data).filter(Boolean))].sort();
          if(!datas.length) return alert('Não foi possível identificar as datas das movimentações do arquivo OFX.');

          setOfxImportModal({
            open: true,
            contaId: String(concilContaId),
            contaNome: conta.nome,
            arquivoId,
            arquivoNome: file.name,
            transacoes,
            datas,
            dataSelecionada: datas.length === 1 ? datas[0] : ''
          });
        };
        reader.readAsText(file);
        if(ofxInputRef.current) ofxInputRef.current.value='';
      }

      function confirmarImportacaoOfx(){
        if(!ofxImportModal.open) return;
        const data = ofxImportModal.dataSelecionada;
        if(!data) return alert('Selecione o dia que deseja importar.');
        const transacoesDia = ofxImportModal.transacoes.filter(t => t.data === data);
        if(!transacoesDia.length) return alert('Não existem movimentações nesse dia no arquivo OFX.');

        const jaImportadas = ofxData.filter(o =>
          mesmaContaOfx(o.contaId, ofxImportModal.contaId) &&
          o.data === data
        );
        if(jaImportadas.length){
          const conciliadas = jaImportadas.filter(o => o.conciliado);
          if(conciliadas.length){
            return alert(`O dia ${formatDateBR(data)} já possui ${jaImportadas.length} lançamento(s) OFX importado(s), sendo ${conciliadas.length} conciliado(s). Desfaça as conciliações antes de importar novamente esse dia.`);
          }
          if(!window.confirm(`Já existem ${jaImportadas.length} lançamento(s) OFX dessa conta no dia ${formatDateBR(data)}.\n\nDeseja importar novamente mesmo assim? Isso criará lançamentos duplicados.`)) return;
        }

        updateOfxData(prev => [...prev, ...transacoesDia]);
        setOfxSelectedIds([]);
        setSysSelectedIds([]);
        setOfxImportModal({ open: false, contaId: '', contaNome: '', arquivoId: '', arquivoNome: '', transacoes: [], datas: [], dataSelecionada: '' });
        alert(`${transacoesDia.length} lançamento(s) do dia ${formatDateBR(data)} importado(s) para ${ofxImportModal.contaNome}.\nBanco: ${transacoesDia[0].bancoOfx || '-'} | Agência: ${transacoesDia[0].agenciaOfx || '-'} | Conta: ${transacoesDia[0].contaOfx || '-'}`);
      }

      function excluirMovimentacoesOfxDia(){
        if(!concilContaId) return alert('Selecione a Conta Bancária no filtro antes de excluir movimentações OFX.');
        if(!ofxExcluirDia) return alert('Selecione o dia que deseja excluir.');

        const registros = ofxData.filter(o =>
          mesmaContaOfx(o.contaId, concilContaId) && o.data === ofxExcluirDia
        );
        if(!registros.length) return alert(`Não existem movimentações OFX para a conta selecionada no dia ${formatDateBR(ofxExcluirDia)}.`);
        const conciliados = registros.filter(o => o.conciliado);
        if(conciliados.length){
          return alert(`Não é possível excluir o dia ${formatDateBR(ofxExcluirDia)} porque ${conciliados.length} lançamento(s) OFX estão conciliados. Desfaça as conciliações primeiro.`);
        }

        const arquivos = [...new Set(registros.map(o => o.ofxArquivoNome).filter(Boolean))];
        const detalheArquivos = arquivos.length ? `\nArquivo(s): ${arquivos.join(', ')}` : '';
        if(!window.confirm(`Excluir TODOS os ${registros.length} lançamento(s) OFX da conta selecionada no dia ${formatDateBR(ofxExcluirDia)}?\n${detalheArquivos}\n\nOs lançamentos do sistema não serão excluídos.`)) return;

        updateOfxData(prev => prev.filter(o => !(mesmaContaOfx(o.contaId, concilContaId) && o.data === ofxExcluirDia)));
        setOfxSelectedIds([]);
        setSysSelectedIds([]);
        setOfxExcluirDiaModalOpen(false);
        alert(`Movimentações OFX do dia ${formatDateBR(ofxExcluirDia)} excluídas com sucesso.`);
      }

      function excluirArquivoOfx(arquivoId){
        if(!arquivoId) return alert('Este lançamento OFX não possui identificação do arquivo de origem.');
        const registros = ofxData.filter(o => o.ofxArquivoId === arquivoId);
        if(!registros.length) return alert('Arquivo OFX não encontrado.');
        if(registros.some(o => o.conciliado)) return alert('Não é possível excluir este arquivo porque existem lançamentos OFX conciliados. Desfaça as conciliações primeiro.');
        const nome = registros.find(o => o.ofxArquivoNome)?.ofxArquivoNome || 'arquivo OFX';
        if(!window.confirm(`Excluir o arquivo OFX "${nome}" e seus ${registros.length} lançamento(s)? Esta ação não exclui lançamentos do sistema.`)) return;
        updateOfxData(prev => prev.filter(o => o.ofxArquivoId !== arquivoId));
        setOfxSelectedIds([]);
        setSysSelectedIds([]);
        alert('Arquivo OFX excluído com sucesso.');
      }

      const ofxArquivosImportados = useMemo(() => {
        const mapa = new Map();

      function handleConciliarMatch(){
        if(!ofxSelectedIds.length||!sysSelectedIds.length)return alert('Selecione pelo menos um lançamento OFX e um lançamento do sistema.');
        const os=ofxData.filter(o=>ofxSelectedIds.includes(o.id)&&mesmaContaOfx(o.contaId,concilContaId)&&!o.conciliado);
        const ss=movimentacoesConciliacao.filter(m=>sysSelectedIds.includes(m.id)&&!m.conciliado);
        if(!os.length||!ss.length)return alert('Selecione lançamentos ainda não conciliados.');
        const osig=new Set(os.map(o=>o.valor<0?'debito':'credito'));
        const ssig=new Set(ss.map(m=>m.tipo==='Débito'?'debito':'credito'));
        if(osig.size!==1||ssig.size!==1||[...osig][0]!==[...ssig][0])return alert('Os lançamentos selecionados não são do mesmo valor.');
        const a=os.reduce((s,o)=>s+Math.round(Math.abs(o.valor)*100),0);
        const b=ss.reduce((s,m)=>s+Math.round((m.valorDebito||m.valorCredito||0)*100),0);
        if(a!==b)return alert('Os lançamentos selecionados não são do mesmo valor.');

        const conciliacaoId=`conc-${uid()}`;
        const ofxIds=os.map(o=>o.id);

        updateOfxData(p=>p.map(o=>
          ofxIds.includes(o.id)&&mesmaContaOfx(o.contaId,concilContaId)
            ? {...o,conciliado:true,conciliacaoId:conciliacaoId}
            : o
        ));

        const pi=ss.filter(m=>m.tipoOrigem==='pagar').map(m=>m.itemRef.id);
        const ri=ss.filter(m=>m.tipoOrigem==='receber').map(m=>m.itemRef.id);
        const fi=ss.filter(m=>m.tipoOrigem==='fatura');

        if(pi.length)updateContasPagar(p=>p.map(x=>pi.includes(x.id)?{...x,conciliado:true,conciliacaoId:conciliacaoId}:x));
        if(ri.length)updateContasReceber(p=>p.map(x=>ri.includes(x.id)?{...x,conciliado:true,conciliacaoId:conciliacaoId}:x));
        if(fi.length)updateFaturasBaixadas(p=>{
          const n={...p};
          fi.forEach(m=>n[m.competenciaRef]={...n[m.competenciaRef],conciliado:true,conciliacaoId:conciliacaoId});

      function desfazerConciliacaoPorOfx(ofx){
        if(!ofx || !ofx.conciliado) return;

        const conciliacaoId = ofx.conciliacaoId;
        if(!conciliacaoId) {
          return alert("Não foi possível identificar o vínculo desta conciliação. Essa conciliação foi criada em uma versão anterior do sistema.");
        }

        desfazerConciliacaoPorId(conciliacaoId);
      }

      function desfazerConciliacaoPorId(conciliacaoId){
        if(!conciliacaoId) return;

        const ofxVinculados = ofxData.filter(o =>
          o.conciliado && o.conciliacaoId === conciliacaoId
        );

        const pagarVinculados = contasPagar.filter(p =>
          p.conciliado && p.conciliacaoId === conciliacaoId
        );

        const receberVinculados = contasReceber.filter(r =>
          r.conciliado && r.conciliacaoId === conciliacaoId
        );

        const faturasVinculadas = Object.entries(faturasBaixadas).filter(([comp, baixa]) =>
          baixa && baixa.conciliado && baixa.conciliacaoId === conciliacaoId
        );

        const totalVinculados = ofxVinculados.length + pagarVinculados.length + receberVinculados.length + faturasVinculadas.length;

        if(totalVinculados === 0){
          return alert("Não foi possível localizar os lançamentos vinculados a esta conciliação.");
        }

        if(!window.confirm("Deseja desfazer esta conciliação? Os lançamentos do sistema e o OFX continuarão existindo.")) return;

        // OFX: remove somente o vínculo da conciliação.
        updateOfxData(prev => prev.map(o =>
          o.conciliacaoId === conciliacaoId
            ? {...o, conciliado:false, conciliacaoId:null, lancamentoId:null}
            : o
        ));

        // Contas a pagar: remove o vínculo da conciliação, mantendo a baixa.
        updateContasPagar(prev => prev.map(x =>
          x.conciliacaoId === conciliacaoId
            ? {...x, conciliado:false, conciliacaoId:null}
            : x
        ));

        // Contas a receber: remove o vínculo da conciliação, mantendo a baixa.
        updateContasReceber(prev => prev.map(x =>
          x.conciliacaoId === conciliacaoId
            ? {...x, conciliado:false, conciliacaoId:null}
            : x
        ));

        // Faturas baixadas: remove o vínculo da conciliação.
        updateFaturasBaixadas(prev => {
          const n = {...prev};
          Object.keys(n).forEach(comp => {
            if(n[comp] && n[comp].conciliacaoId === conciliacaoId){
              n[comp] = {...n[comp], conciliado:false, conciliacaoId:null};
            }
          });
          return n;
        });

        setOfxSelectedIds([]);
        setSysSelectedIds([]);
        alert("Conciliação desfeita com sucesso.");
      }

      // Mantida para compatibilidade com chamadas existentes no aplicativo.
      function desfazerConciliacao(sys){
        if(!sys || !sys.conciliado) return;

        if(!conciliacaoId) {
          return alert("Não foi possível identificar exatamente o vínculo desta conciliação. Essa conciliação foi criada em uma versão anterior do sistema.");

          if(ofxSelectedIds.includes(o.id) && o.conciliado && o.conciliacaoId){

        const conciliacoes = [...ids];

          return alert('Selecione pelo menos um lançamento que esteja conciliado para remover a conciliação.');
        }

        if(!window.confirm(`Deseja remover a conciliação de ${conciliacoes.length === 1 ? 'este lançamento' : 'estes lançamentos'}? Os lançamentos continuarão existindo.`)) return;

        updateOfxData(prev => prev.map(o =>

        ));

        ));

      const calendarioDiasDoMes = useMemo(() => {
        const [ano, mes] = concilCalMes.split("-").map(Number);
        const ultimoDia = new Date(ano, mes, 0).getDate();
        const primeiroDia = `${ano}-${String(mes).padStart(2, "0")}-01`;
        const dias = [];
        let acumulado = Number(contasBancarias.find(c => String(c.id) === String(concilContaId))?.saldoInicial || 0);

        if (concilContaId) {
          // Carrega o saldo acumulado de todos os meses anteriores.
          contasPagar.forEach(p => {
            if (p.status === "Baixado" && String(p.bancoBaixaId) === String(concilContaId) && p.dataBaixa && p.dataBaixa < primeiroDia) {
              acumulado -= Number(p.recorrente ? p.valorParcela : (p.valorParcela || p.total)) || 0;
            }
          });
          contasReceber.forEach(r => {
            if (r.status === "Baixado" && String(r.bancoBaixaId) === String(concilContaId) && r.dataBaixa && r.dataBaixa < primeiroDia) {
              acumulado += Number(r.recorrente ? r.valorParcela : (r.valorParcela || r.total)) || 0;
            }
          });
          Object.entries(faturasBaixadas).forEach(([comp, baixa]) => {
            if (baixa && baixa.status === 'Baixado' && String(baixa.bancoId) === String(concilContaId) && baixa.dataBaixa && baixa.dataBaixa < primeiroDia) {
              acumulado -= Number(calcularTotalFaturaCompetencia(comp)) || 0;
            }
          });
        }

        for (let d = 1; d <= ultimoDia; d++) {
          const strD = `${ano}-${String(mes).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          let deb = 0; let cred = 0;
          if (concilContaId) {
            contasPagar.forEach(p => { if (p.status === "Baixado" && String(p.bancoBaixaId) === String(concilContaId) && p.dataBaixa === strD) deb += Number(p.recorrente ? (p.valorParcela||p.total) : (p.valorParcela || p.total)) || 0; });
            contasReceber.forEach(r => { if (r.status === "Baixado" && String(r.bancoBaixaId) === String(concilContaId) && r.dataBaixa === strD) cred += Number(r.recorrente ? (r.valorParcela||r.total) : (r.valorParcela || r.total)) || 0; });
            Object.entries(faturasBaixadas).forEach(([comp, baixa]) => {
              if (baixa && baixa.status === 'Baixado' && String(baixa.bancoId) === String(concilContaId) && baixa.dataBaixa === strD) {
                deb += Number(calcularTotalFaturaCompetencia(comp)) || 0;
              }
            });
          }
          acumulado += (cred - deb);
          dias.push({ data: strD, diaNum: d, debitos: deb, cred: cred, saldo: acumulado });
        }
        return dias;
      }, [concilCalMes, concilContaId, contasBancarias, contasPagar, contasReceber, faturasBaixadas, purchases]);
